<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Betawin | Register</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;

      background:
        radial-gradient(circle at top left, rgba(255,20,147,.35), transparent 35%),
        radial-gradient(circle at bottom right, rgba(0,123,255,.35), transparent 35%),
        #070710;

      color: white;
    }

    .register-card {
      width: 100%;
      max-width: 430px;

      padding: 32px 25px;

      border-radius: 24px;

      background: rgba(18,18,32,.94);

      border: 1px solid rgba(255,255,255,.12);

      box-shadow:
        0 20px 60px rgba(0,0,0,.55),
        0 0 35px rgba(255,20,147,.08);

      backdrop-filter: blur(18px);
    }

    .logo {
      text-align: center;

      font-size: 38px;
      font-weight: 900;

      margin-bottom: 8px;

      background: linear-gradient(
        90deg,
        #ff1493,
        #8a2be2,
        #008cff
      );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      text-align: center;
      color: #aaa;

      margin-bottom: 28px;
      font-size: 15px;
    }

    .input-group {
      margin-bottom: 17px;
    }

    label {
      display: block;

      margin-bottom: 8px;

      font-size: 14px;
      font-weight: 600;

      color: #ddd;
    }

    input {
      width: 100%;
      height: 52px;

      padding: 0 15px;

      border-radius: 13px;

      border: 1px solid #333346;

      background: #10101c;

      color: white;

      font-size: 16px;

      outline: none;

      transition: .25s;
    }

    input::placeholder {
      color: #777;
    }

    input:focus {
      border-color: #ff1493;

      box-shadow:
        0 0 15px rgba(255,20,147,.2);
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 55px;
    }

    .show-password {
      position: absolute;

      right: 13px;
      top: 50%;

      transform: translateY(-50%);

      border: none;

      background: transparent;

      color: #888;

      cursor: pointer;

      font-size: 13px;
    }

    .show-password:hover {
      color: #ff1493;
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 9px;

      margin: 15px 0;

      color: #999;

      font-size: 13px;
      line-height: 1.5;
    }

    .terms input {
      width: 16px;
      height: 16px;

      margin-top: 2px;

      accent-color: #ff1493;
    }

    .terms a {
      color: #4da6ff;
      text-decoration: none;
    }

    .register-btn {
      width: 100%;
      height: 53px;

      border: none;

      border-radius: 13px;

      background: linear-gradient(
        90deg,
        #ff1493,
        #8a2be2,
        #007bff
      );

      color: white;

      font-size: 17px;
      font-weight: bold;

      cursor: pointer;

      transition: .25s;
    }

    .register-btn:hover {
      transform: translateY(-2px);

      box-shadow:
        0 8px 25px rgba(255,20,147,.25);
    }

    .register-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
      transform: none;
    }

    #message {
      min-height: 20px;

      text-align: center;

      margin-top: 15px;

      font-size: 14px;
    }

    .login-link {
      text-align: center;

      margin-top: 23px;

      color: #999;

      font-size: 14px;
    }

    .login-link a {
      color: #4da6ff;

      text-decoration: none;
    }

    .login-link a:hover {
      color: #ff1493;
    }

    .loader {
      display: inline-block;

      width: 15px;
      height: 15px;

      border: 2px solid rgba(255,255,255,.3);

      border-top-color: white;

      border-radius: 50%;

      animation: spin .7s linear infinite;

      vertical-align: middle;

      margin-right: 7px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div class="register-card">

    <div class="logo">
      BETAWIN
    </div>

    <div class="subtitle">
      Create your account
    </div>


    <form id="registerForm">


      <!-- FULL NAME -->

      <div class="input-group">

        <label for="fullName">
          Full Name
        </label>

        <input
          type="text"
          id="fullName"
          name="fullName"
          placeholder="Enter your full name"
          autocomplete="name"
          required
        >

      </div>


      <!-- PHONE -->

      <div class="input-group">

        <label for="phone">
          Phone Number
        </label>

        <input
          type="tel"
          id="phone"
          name="phone"
          placeholder="07XXXXXXXX"
          autocomplete="tel"
          required
        >

      </div>


      <!-- PASSWORD -->

      <div class="input-group">

        <label for="password">
          Password
        </label>

        <div class="password-wrapper">

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a password"
            autocomplete="new-password"
            minlength="6"
            required
          >

          <button
            type="button"
            class="show-password"
            id="showPassword"
          >
            Show
          </button>

        </div>

      </div>


      <!-- CONFIRM PASSWORD -->

      <div class="input-group">

        <label for="confirmPassword">
          Confirm Password
        </label>

        <div class="password-wrapper">

          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Confirm your password"
            autocomplete="new-password"
            minlength="6"
            required
          >

          <button
            type="button"
            class="show-password"
            id="showConfirmPassword"
          >
            Show
          </button>

        </div>

      </div>


      <!-- TERMS -->

      <div class="terms">

        <input
          type="checkbox"
          id="terms"
          required
        >

        <label for="terms">
          I agree to the
          <a href="/terms.html">
            Terms & Conditions
          </a>
          and
          <a href="/privacy.html">
            Privacy Policy
          </a>.
        </label>

      </div>


      <!-- REGISTER BUTTON -->

      <button
        type="submit"
        class="register-btn"
        id="registerBtn"
      >
        Create Account
      </button>


      <!-- MESSAGE -->

      <div id="message"></div>

    </form>


    <!-- LOGIN -->

    <div class="login-link">

      Already have an account?

      <a href="/login.html">
        Login
      </a>

    </div>

  </div>


  <script>

    const form =
      document.getElementById("registerForm");

    const registerBtn =
      document.getElementById("registerBtn");

    const message =
      document.getElementById("message");


    /* =========================
       PASSWORD SHOW / HIDE
    ========================== */

    document
      .getElementById("showPassword")
      .addEventListener("click", function () {

        const input =
          document.getElementById("password");

        if (input.type === "password") {

          input.type = "text";
          this.textContent = "Hide";

        } else {

          input.type = "password";
          this.textContent = "Show";

        }

      });


    document
      .getElementById("showConfirmPassword")
      .addEventListener("click", function () {

        const input =
          document.getElementById("confirmPassword");

        if (input.type === "password") {

          input.type = "text";
          this.textContent = "Hide";

        } else {

          input.type = "password";
          this.textContent = "Show";

        }

      });


    /* =========================
       REGISTER
    ========================== */

    form.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();


        const fullName =
          document
            .getElementById("fullName")
            .value
            .trim();


        const phone =
          document
            .getElementById("phone")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        const confirmPassword =
          document
            .getElementById("confirmPassword")
            .value;


        message.textContent = "";


        /* =========================
           VALIDATION
        ========================== */

        if (!fullName || !phone || !password) {

          message.style.color = "#ff5c7a";

          message.textContent =
            "Please fill in all fields.";

          return;
        }


        if (password.length < 6) {

          message.style.color = "#ff5c7a";

          message.textContent =
            "Password must be at least 6 characters.";

          return;
        }


        if (password !== confirmPassword) {

          message.style.color = "#ff5c7a";

          message.textContent =
            "Passwords do not match.";

          return;
        }


        /* =========================
           DISABLE BUTTON
        ========================== */

        registerBtn.disabled = true;

        registerBtn.innerHTML =
          '<span class="loader"></span>Creating Account...';


        try {


          /* =========================
             BACKEND REQUEST
          ========================== */

          const response =
            await fetch(
              "/api/auth/register",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                credentials: "include",

                body: JSON.stringify({

                  fullName: fullName,

                  phone: phone,

                  password: password,

                  confirmPassword:
                    confirmPassword

                })
              }
            );


          let data;


          try {

            data =
              await response.json();

          } catch {

            throw new Error(
              "Server returned an invalid response."
            );

          }


          /* =========================
             ERROR
          ========================== */

          if (!response.ok) {

            throw new Error(
              data.message ||
              "Registration failed."
            );

          }


          /* =========================
             SUCCESS
          ========================== */

          message.style.color =
            "#35ff9b";

          message.textContent =
            "Account created successfully!";


          /*
            Save token if backend
            returns one.
          */

          if (data.token) {

            localStorage.setItem(
              "token",
              data.token
            );

          }


          /*
            Save user information.
          */

          if (data.user) {

            localStorage.setItem(
              "user",
              JSON.stringify(data.user)
            );

          }


          /*
            Redirect to login.
          */

          setTimeout(function () {

            window.location.href =
              "/login.html";

          }, 900);


        } catch (error) {

          console.error(
            "REGISTER ERROR:",
            error
          );


          message.style.color =
            "#ff5c7a";

          message.textContent =
            error.message ||
            "Unable to connect to server.";


          registerBtn.disabled = false;

          registerBtn.textContent =
            "Create Account";

        }

      }
    );

  </script>

</body>
  </html>
